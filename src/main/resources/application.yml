spring:
  application:
    name: Inventory_Management

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    # Thymeleaf + lazy associations: true avoids LazyInitializationException during view render.
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads/products}

management:
  endpoints:
    web:
      exposure:
        include: health,info
