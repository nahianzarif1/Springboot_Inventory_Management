<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sign in</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container">
    <div class="h1">Sign in</div>
    <p class="sub">Use a seeded account or <a th:href="@{/register}">register</a> as a buyer.</p>

    <div class="card" style="max-width:520px;">
        <form th:action="@{/login}" method="post" class="stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="input">
                <label>Username</label>
                <input type="text" name="username" autocomplete="username" required/>
            </div>
            <div class="input">
                <label>Password</label>
                <input type="password" name="password" autocomplete="current-password" required/>
            </div>
            <button class="btn primary" type="submit">Login</button>
        </form>
        <p class="muted" style="margin-top:14px;">admin/admin123 · seller/seller123 · buyer/buyer123</p>
    </div>
</main>
</body>
</html>
