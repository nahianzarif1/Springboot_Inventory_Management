<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sign in</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="h1">Sign in</div>
        <div th:if="${param.logout}" class="card" style="margin-bottom:14px; border-color: rgba(43,213,118,.35);">
            <span class="badge success">You have been signed out.</span>
        </div>
        <p class="sub">Use a seeded account or <a th:href="@{/register}">register</a> as a buyer.</p>

        <form th:action="@{/login}" method="post" class="stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="input">
                <label>Username</label>
                <input type="text" name="username" autocomplete="username" required/>
            </div>
            <div class="input">
                <label>Password</label>
                <input type="password" name="password" autocomplete="current-password" required/>
            </div>
            <button class="btn primary" type="submit">Login</button>
        </form>

        <div class="card" style="margin-top:14px; background: #fff; box-shadow:none;">
            <div class="muted" style="font-weight:900; margin-bottom:6px;">Demo accounts</div>
            <div class="muted">admin / admin123</div>
            <div class="muted">seller / seller123</div>
            <div class="muted">buyer / buyer123</div>
        </div>

        <div class="muted" style="margin-top:12px;">Back to <a th:href="@{/}">Home</a></div>
    </div>
</div>
</body>
</html>
