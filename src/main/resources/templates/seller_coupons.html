<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Coupons</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container">
    <div class="h1">Coupons &amp; discounts</div>
    <p class="sub">Create codes for buyers to use at checkout. Discount applies only to <strong>your</strong> products in the cart.</p>

    <div class="card" style="margin-bottom:16px;">
        <div class="h1" style="font-size:18px;">Create coupon</div>
        <form th:action="@{/ui/seller/coupons}" method="post" class="stack" style="max-width:520px; margin-top:12px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="input">
                <label>Code</label>
                <input type="text" name="code" required minlength="3" maxlength="40" placeholder="e.g. SAVE10"/>
            </div>
            <div class="input">
                <label>Discount type</label>
                <select name="discountType">
                    <option th:each="t : ${discountTypes}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="input">
                <label th:title="'PERCENT: 1–100. FIXED: amount off eligible subtotal.'">Value</label>
                <input type="number" name="discountValue" step="0.01" min="0.01" required placeholder="10 or 5.00"/>
            </div>
            <div class="input">
                <label>Expires (local)</label>
                <input type="datetime-local" name="expiresAt" required/>
            </div>
            <div class="input">
                <label>Usage limit (empty = unlimited)</label>
                <input type="number" name="usageLimit" min="1" placeholder="e.g. 100"/>
            </div>
            <button class="btn primary" type="submit">Create</button>
        </form>
    </div>

    <div class="card">
        <div class="h1" style="font-size:18px;">Your coupons</div>
        <p class="muted" th:if="${#lists.isEmpty(coupons)}">No coupons yet.</p>
        <table class="table" th:if="${!#lists.isEmpty(coupons)}">
            <thead>
            <tr>
                <th>Code</th>
                <th>Type</th>
                <th>Value</th>
                <th>Expires</th>
                <th>Uses</th>
                <th>Active</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${coupons}">
                <td th:text="${c.code}">CODE</td>
                <td th:text="${c.discountType}">PERCENT</td>
                <td th:text="${c.discountValue}">0</td>
                <td th:text="${c.expiresAt}">-</td>
                <td>
                    <span th:text="${c.usageCount}">0</span>
                    <span class="muted" th:if="${c.usageLimit != null}"> / <span th:text="${c.usageLimit}">0</span></span>
                    <span class="muted" th:if="${c.usageLimit == null}"> / ∞</span>
                </td>
                <td th:text="${c.active}">true</td>
                <td>
                    <form th:if="${c.active}" th:action="@{'/ui/seller/coupons/' + ${c.id} + '/deactivate'}" method="post"
                          onsubmit="return confirm('Deactivate this coupon?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn danger" type="submit">Deactivate</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="muted" style="margin-top:16px;"><a th:href="@{/ui/seller}">← Back to seller workspace</a></p>
</main>
</body>
</html>
