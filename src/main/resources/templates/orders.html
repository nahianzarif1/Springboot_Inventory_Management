<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Orders</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container">
    <div class="h1" th:text="${admin} ? 'All orders' : 'My orders'">Orders</div>
    <p class="sub" th:if="${admin}">Monitor fulfillment and update status. Buyers can cancel until shipped.</p>
    <p class="sub" th:unless="${admin}">Cancel is allowed before the order is marked shipped.</p>

    <div class="card">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Buyer</th>
                <th>Status</th>
                <th>Subtotal</th>
                <th>Discount</th>
                <th>Coupon</th>
                <th>Total</th>
                <th>Created</th>
                <th>Items</th>
                <th sec:authorize="hasRole('ADMIN')">Admin</th>
                <th sec:authorize="hasRole('BUYER')">Buyer</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="${o.id}">1</td>
                <td th:text="${o.buyerUsername}">buyer</td>
                <td th:text="${o.status}">PENDING</td>
                <td th:text="${o.subtotal}">0</td>
                <td th:text="${o.discountAmount}">0</td>
                <td th:text="${o.couponCode != null ? o.couponCode : '—'}">—</td>
                <td th:text="${o.totalPrice}">0</td>
                <td th:text="${o.createdAt}">-</td>
                <td>
                    <ul class="muted stack" style="margin:0;padding-left:18px;">
                        <li th:each="i : ${o.items}"
                            th:text="${i.productName + ' × ' + i.quantity + ' @ ' + i.unitPrice}">Item</li>
                    </ul>
                </td>
                <td sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{'/ui/orders/' + ${o.id} + '/status'}" method="post" class="row-actions">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <select name="status">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                        </select>
                        <button class="btn primary" type="submit">Set status</button>
                    </form>
                </td>
                <td sec:authorize="hasRole('BUYER')">
                    <form th:if="${o.status.name() != 'SHIPPED' && o.status.name() != 'CANCELED'}"
                          th:action="@{'/ui/orders/' + ${o.id} + '/cancel'}" method="post"
                          onsubmit="return confirm('Cancel this order? Stock will be restored.');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn danger" type="submit">Cancel</button>
                    </form>
                    <form th:if="${o.status.name() == 'PENDING'}"
                          th:action="@{'/ui/orders/' + ${o.id} + '/pay-demo'}"
                          method="post"
                          style="margin-top:8px;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn primary" type="submit">Pay (Demo)</button>
                    </form>
                    <span class="muted" th:if="${o.status.name() == 'SHIPPED' || o.status.name() == 'CANCELED'}">—</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
