<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Products</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container">
    <div class="h1">Products</div>
    <p class="sub">Public catalog. Sign in as seller or admin to create and manage listings.</p>

    <div class="card" style="margin-bottom:16px;">
        <form th:action="@{/ui/products}" method="get" class="form">
            <div class="input">
                <label>Search</label>
                <input type="text" name="q" placeholder="Name or SKU" th:value="${q}"/>
            </div>
            <div class="input">
                <label>Category</label>
                <select name="categoryId">
                    <option value="">All</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${categoryId != null && categoryId == c.id}"></option>
                </select>
            </div>
            <button class="btn primary" type="submit">Apply</button>
        </form>
    </div>

    <div class="card">
        <table class="table">
            <thead>
            <tr>
                <th></th>
                <th>SKU</th>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Category</th>
                <th>Seller</th>
                <th sec:authorize="isAuthenticated()">Cart</th>
                <th sec:authorize="hasAnyRole('SELLER','ADMIN')">Manage</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}">
                <td>
                    <img th:if="${p.imageUrl != null}" class="thumb" th:src="${p.imageUrl}" alt=""/>
                    <span th:unless="${p.imageUrl != null}" class="muted">—</span>
                </td>
                <td th:text="${p.sku}">SKU</td>
                <td>
                    <div th:text="${p.name}">Name</div>
                    <div class="muted" th:if="${p.description != null && !p.description.isEmpty()}" th:text="${p.description}">desc</div>
                </td>
                <td th:text="${p.price}">0</td>
                <td th:text="${p.stockQuantity}">0</td>
                <td th:text="${p.categoryName} ?: '—'">-</td>
                <td th:text="${p.sellerUsername}">seller</td>
                <td sec:authorize="hasRole('BUYER')">
                    <form th:action="@{/ui/cart/add}" method="post" class="row-actions">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="productId" th:value="${p.id}"/>
                        <input type="number" name="quantity" value="1" min="1" style="width:64px;" class="input"/>
                        <button class="btn success" type="submit">Add</button>
                    </form>
                </td>
                <td sec:authorize="hasAnyRole('SELLER','ADMIN')">
                    <div class="stack">
                        <form th:action="@{'/ui/products/' + ${p.id} + '/update'}" method="post" class="stack">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="text" name="name" th:value="${p.name}" placeholder="Name"/>
                            <input type="text" name="description" th:value="${p.description}" placeholder="Description"/>
                            <input type="number" step="0.01" name="price" th:value="${p.price}" placeholder="Price"/>
                            <input type="number" name="stockQuantity" th:value="${p.stockQuantity}" placeholder="Stock"/>
                            <select name="categoryId">
                                <option value="">— category —</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                                        th:selected="${p.categoryId != null && p.categoryId == c.id}"></option>
                            </select>
                            <button class="btn primary" type="submit">Save</button>
                        </form>
                        <form th:action="@{'/ui/products/' + ${p.id} + '/image'}" method="post" enctype="multipart/form-data" class="row-actions">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="file" name="file" accept="image/*"/>
                            <button class="btn" type="submit">Upload image</button>
                        </form>
                        <form th:action="@{'/ui/products/' + ${p.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Delete this product?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn danger" type="submit">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card" style="margin-top:16px;" sec:authorize="hasAnyRole('SELLER','ADMIN')">
        <div class="h1" style="font-size:20px;">Create product</div>
        <form th:action="@{/ui/products}" method="post" th:object="${createForm}" class="stack" style="max-width:520px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="input">
                <label>SKU</label>
                <input type="text" th:field="*{sku}" required/>
            </div>
            <div class="input">
                <label>Name</label>
                <input type="text" th:field="*{name}" required/>
            </div>
            <div class="input">
                <label>Description</label>
                <input type="text" th:field="*{description}"/>
            </div>
            <div class="input">
                <label>Price</label>
                <input type="number" step="0.01" th:field="*{price}" required/>
            </div>
            <div class="input">
                <label>Stock</label>
                <input type="number" th:field="*{stockQuantity}"/>
            </div>
            <div class="input">
                <label>Category</label>
                <select th:field="*{categoryId}">
                    <option value="">Optional</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </div>
            <button class="btn primary" type="submit">Create</button>
        </form>
    </div>
</main>
</body>
</html>
