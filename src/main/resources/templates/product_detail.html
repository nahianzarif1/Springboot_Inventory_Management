<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${product.name}">Product</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container">
    <p class="muted" style="margin-bottom:12px;"><a th:href="@{/ui/products}">← Back to products</a></p>

    <div class="card" style="display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 24px; align-items:start;"
         th:if="${product != null}">
        <div>
            <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" alt=""
                 style="width:100%; max-height:360px; object-fit:contain; border-radius:12px; background: rgba(0,0,0,.04);"/>
            <div th:unless="${product.imageUrl != null}" class="product-card__img" style="min-height:240px;"></div>
        </div>
        <div>
            <div class="h1" style="margin-top:0;" th:text="${product.name}">Name</div>
            <p class="muted" th:text="${product.description != null && !product.description.isEmpty() ? product.description : 'No description.'}">Desc</p>
            <div class="product-card__price" style="font-size:1.5rem; margin:12px 0;">৳ <span th:text="${product.price}">0</span></div>
            <div class="product-card__meta">
                SKU: <span th:text="${product.sku}">—</span>
                · Stock: <span th:text="${product.stockQuantity}">0</span>
                · <span th:text="${product.categoryName} ?: 'Uncategorized'">Category</span>
            </div>
            <div class="product-card__meta" style="margin-top:8px;">
                Seller: <span th:text="${product.sellerUsername}">—</span>
                · Rating: <span th:text="${#numbers.formatDecimal(product.averageRating, 1, 1)}">0.0</span>
                (<span th:text="${product.reviewCount}">0</span> reviews)
                · <a th:href="@{'/ui/products/' + ${product.id} + '/reviews'}" style="color: var(--accent); text-decoration:none; font-weight:800;">Reviews</a>
            </div>

            <div class="row-actions" style="margin-top:20px;" sec:authorize="hasRole('BUYER')">
                <form th:action="@{/ui/cart/add}" method="post" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="productId" th:value="${product.id}"/>
                    <input type="number" name="quantity" value="1" min="1" style="width:72px;"/>
                    <button class="btn primary" type="submit">Add to cart</button>
                </form>
            </div>
            <p class="muted" style="margin-top:16px;" sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" style="color: var(--accent); text-decoration:none; font-weight:800;">Sign in</a> as a buyer to add this item to your cart.
            </p>
        </div>
    </div>
</main>
</body>
</html>
