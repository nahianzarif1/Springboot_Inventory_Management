<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Cart</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: alerts}"></div>
<main class="container" sec:authorize="hasRole('BUYER')">
    <div class="h1">Your cart</div>
    <p class="sub">Update quantities or remove lines, then checkout to place an order.</p>

    <div class="card" th:if="${#lists.isEmpty(cartItems)}">
        <p class="muted">Cart is empty. <a th:href="@{/ui/products}">Browse products</a>.</p>
    </div>

    <div class="card" th:unless="${#lists.isEmpty(cartItems)}">
        <table class="table">
            <thead>
            <tr>
                <th>Product</th>
                <th>Unit price</th>
                <th>Qty</th>
                <th>Line</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.productName}">Name</td>
                <td th:text="${item.unitPrice}">0</td>
                <td>
                    <form th:action="@{/ui/cart/update}" method="post" class="row-actions">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="productId" th:value="${item.productId}"/>
                        <input type="number" name="quantity" th:value="${item.quantity}" min="1" style="width:72px;"/>
                        <button class="btn" type="submit">Update</button>
                    </form>
                </td>
                <td th:text="${item.unitPrice * item.quantity}">0</td>
                <td>
                    <form th:action="@{/ui/cart/remove}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="productId" th:value="${item.productId}"/>
                        <button class="btn danger" type="submit">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="checkout-box">
            <div class="summary">
                <div class="muted" style="font-weight:900;">Order summary</div>
                <div class="muted" style="margin-top:8px;">Checkout will create an order and reduce stock.</div>
            </div>
            <div class="payment">
                <div class="muted" style="font-weight:900;">Demo payment</div>
                <div class="muted" style="margin-top:6px;">Choose any option below (no real payment is processed).</div>

                <form th:action="@{/ui/cart/checkout}" method="post" style="margin-top:12px;" class="stack">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="input">
                        <label>Payment method</label>
                        <select name="paymentMethod">
                            <option value="COD">Cash on Delivery (Demo)</option>
                            <option value="CARD">Card (Demo)</option>
                            <option value="BKASH">bKash (Demo)</option>
                        </select>
                    </div>

                    <button class="btn primary" type="submit">Checkout</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
