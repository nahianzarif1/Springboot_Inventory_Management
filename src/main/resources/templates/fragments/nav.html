<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav" class="nav">
    <a class="brand" th:href="@{/}">
        <img class="logo" th:src="@{/images/logo.svg}" alt=""/>
        <div>
            <div class="brand-title">Inventory Management</div>
            <div style="color: var(--muted); font-size: 12px;">Admin · Seller · Buyer</div>
        </div>
    </a>
    <div class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/ui/products}">Products</a>
        <a sec:authorize="hasRole('BUYER')" th:href="@{/ui/cart}">Cart</a>
        <a sec:authorize="hasRole('BUYER')" th:href="@{/ui/orders}">My orders</a>
        <a sec:authorize="hasRole('SELLER')" th:href="@{/ui/seller}">Seller</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/ui/admin}">Users</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/ui/admin/products}">Inventory</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/ui/reports}">Reports</a>
        <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Login</a>
        <a th:href="@{/register}" sec:authorize="!isAuthenticated()">Register</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/auth/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn" type="submit">Logout</button>
        </form>
    </div>
</nav>
<div th:fragment="alerts" class="container" style="padding-top:0;">
    <div th:if="${message}" class="card" style="margin-top:16px; border-color: rgba(43,213,118,.35);">
        <span class="badge success"><strong>OK</strong> <span th:text="${message}">Message</span></span>
    </div>
    <div th:if="${error}" class="card" style="margin-top:16px; border-color: rgba(255,93,93,.35);">
        <span class="badge danger"><strong>Error</strong> <span th:text="${error}">Error</span></span>
    </div>
</div>
</body>
</html>
